services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rentiq
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: rentiq_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rentiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
