openapi: 3.0.3
info:
  title: RentIQ API — IAM + Organizations + Locations + Pricing (Phase 3)
  description: |
    Authentication, renter identity, and organization management for the RentIQ modular
    monolith. All endpoints live under the `/api` global prefix (`servers[0]` below already
    includes it; controllers map `v1/...`).

    Error envelope (Phase 1): `{ "correlationId", "code", "message", "timestamp" }` where
    `message` is localized per ADR-006 (JWT `locale` claim → org `defaultLocale` → `uk`).
    See `specs/005-iam-organizations/contracts/api.md` for the authoritative error-code table.
  version: 0.2.0
servers:
  - url: /api
tags:
  - name: Auth
    description: Admin login / refresh (US3)
  - name: Renters
    description: Renter identity, consent, locale (US1/US2/US4/US7)
  - name: Organizations
    description: Org bootstrap, branding, maintenance window (US6)
  - name: Stations
    description: Station CRUD + renter bookable list + health (Phase 3)
  - name: Lockers
    description: Locker CRUD + manual open/close (Phase 3)
  - name: InventoryKits
    description: Inventory kit CRUD (Phase 3)
  - name: Tariffs
    description: Tariff CRUD + quote (Phase 3)
  - name: Webhooks
    description: HA door-events ingress (Phase 3)
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Admin login
      description: Returns an access + refresh token pair. Uniform `INVALID_CREDENTIALS` (401) for wrong credentials and disabled accounts (NFR-009).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token pair + admin identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token
      description: Invalidates the presented refresh token and reissues a new pair (rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair (same shape as login)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: INVALID_REFRESH_TOKEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/auth/telegram/exchange:
    post:
      tags: [Auth]
      summary: Exchange a Telegram session for a renter JWT
      description: Called by the bot with the org bot secret. Renter must exist and be ACTIVE in the bot's org.
      security:
        - BotSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramExchangeRequest' }
      responses:
        '200':
          description: Renter JWT + profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramExchangeResponse' }
        '401':
          description: BOT_SECRET_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: RENTER_NOT_REGISTERED | RENTER_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/renters/register:
    post:
      tags: [Renters]
      summary: Register a renter (public, bot-invoked)
      description: |
        Creates a renter identity with explicit consent (BR-01.1) and returns a renter JWT.
        An existing ACTIVE renter with the same phone in this org returns the existing
        identity with `alreadyRegistered: true` (FR-028).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRenterRequest' }
      responses:
        '200':
          description: Renter profile + JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterRenterResponse' }
        '400':
          description: CONSENT_REQUIRED | VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: RENTER_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/renters/me:
    get:
      tags: [Renters]
      summary: Current renter profile
      security:
        - Bearer: []
      responses:
        '200':
          description: Renter profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  renter: { $ref: '#/components/schemas/RenterProfile' }
        '403':
          description: FORBIDDEN (token type is not renter)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Renters]
      summary: Change renter locale (changeable at any time, DR-003)
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLocaleRequest' }
      responses:
        '200':
          description: Renter profile with updated locale
          content:
            application/json:
              schema:
                type: object
                properties:
                  renter: { $ref: '#/components/schemas/RenterProfile' }
        '400':
          description: VALIDATION_ERROR (locale outside org supportedLocales, BR-02.2)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/renters/me/re-consent:
    post:
      tags: [Renters]
      summary: Accept the current consent statement (FR-024, DR-005)
      description: |
        Records acceptance of a material consent change. Never deletes or anonymizes the
        renter. An unknown or non-current `consentVersion` is rejected.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReConsentRequest' }
      responses:
        '200':
          description: Renter profile with updated consentVersion
          content:
            application/json:
              schema:
                type: object
                properties:
                  renter: { $ref: '#/components/schemas/RenterProfile' }
        '400':
          description: RE_CONSENT_REQUIRED | VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/organizations:
    post:
      tags: [Organizations]
      summary: Create an organization + bootstrap ORG_ADMIN (SUPER_ADMIN only)
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationRequest' }
      responses:
        '201':
          description: Organization + bootstrap admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateOrganizationResponse' }
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: SLUG_TAKEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/organizations/{id}/branding:
    patch:
      tags: [Organizations]
      summary: Update organization branding (SUPER_ADMIN only)
      security:
        - Bearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBrandingRequest' }
      responses:
        '200':
          description: Updated organization branding
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [ACTIVE, SUSPENDED] }
                      branding: { $ref: '#/components/schemas/Branding' }
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: FORBIDDEN | ORG_SUSPENDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/organizations/{id}/maintenance-window:
    post:
      tags: [Organizations]
      summary: Set the org maintenance window
      description: |
        ORG_ADMIN (own org) or SUPER_ADMIN (any org) per roadmap. Actual downtime
        enforcement is owned by later capabilities; this endpoint only configures the window.
      security:
        - Bearer: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceWindowRequest' }
      responses:
        '200':
          description: Updated organization with maintenance window
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      maintenanceWindow: { $ref: '#/components/schemas/MaintenanceWindow' }
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: FORBIDDEN | ORG_SUSPENDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/stations:
    get:
      tags: [Stations]
      summary: List stations (admin) or bookable stations (renter)
      description: Admin returns all org stations; renter variant `?visible=true&active=true` returns only bookable stations with `availableLockersCount`.
      parameters:
        - in: query
          name: visible
          schema: { type: boolean }
        - in: query
          name: active
          schema: { type: boolean }
      responses:
        '200':
          description: Station list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationListResponse' }
    post:
      tags: [Stations]
      summary: Create a station
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStationRequest' }
      responses:
        '201':
          description: Created station
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationResponse' }
        '422':
          description: STATION_AUTOLOCK_INVALID / STATION_TOKEN_REF_EMPTY / STATION_HA_URL_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/stations/{id}:
    get:
      tags: [Stations]
      summary: Fetch one station (admin view)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Station
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationResponse' }
        '404':
          description: STATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Stations]
      summary: Update station fields (independent active/visible toggles, FR-004)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStationRequest' }
      responses:
        '200':
          description: Updated station
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationResponse' }
  /v1/stations/{id}/health:
    get:
      tags: [Stations]
      summary: Station health status
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Health view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationHealthResponse' }
  /v1/stations/{id}/lockers:
    get:
      tags: [Stations]
      summary: List bookable lockers for a station (renter)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bookable lockers with tariffs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenterLockerListResponse' }
  /v1/lockers:
    post:
      tags: [Lockers]
      summary: Create a locker
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLockerRequest' }
      responses:
        '201':
          description: Created locker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LockerResponse' }
  /v1/lockers/{id}:
    patch:
      tags: [Lockers]
      summary: Assign/unassign kit, toggle maintenance
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLockerRequest' }
      responses:
        '200':
          description: Updated locker
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LockerResponse' }
  /v1/lockers/{id}/open:
    post:
      tags: [Lockers]
      summary: Admin manual open (schedules auto-relock)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledged' }
        '503':
          description: LOCKER_STATION_OFFLINE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: LOCKER_OPEN_FAILED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/lockers/{id}/close:
    post:
      tags: [Lockers]
      summary: Admin manual close (idempotent, FR-015)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledged' }
  /v1/inventory-kits:
    post:
      tags: [InventoryKits]
      summary: Create an inventory kit
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateKitRequest' }
      responses:
        '201':
          description: Created kit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitResponse' }
  /v1/inventory-kits/{id}:
    patch:
      tags: [InventoryKits]
      summary: Update / reassign a kit
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateKitRequest' }
      responses:
        '200':
          description: Updated kit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KitResponse' }
    delete:
      tags: [InventoryKits]
      summary: Soft-retire a kit (unassign)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledged' }
  /v1/tariffs:
    get:
      tags: [Tariffs]
      summary: List tariffs (optional filter)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: kitType
          schema: { type: string }
        - in: query
          name: dayType
          schema: { type: string, enum: [WEEKDAY, WEEKEND] }
      responses:
        '200':
          description: Tariff list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TariffListResponse' }
    post:
      tags: [Tariffs]
      summary: Create a tariff
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTariffRequest' }
      responses:
        '201':
          description: Created tariff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TariffResponse' }
        '422':
          description: DUPLICATE_TARIFF / TARIFF_DURATION_INVALID / TARIFF_PRICE_INVALID / TARIFF_DAY_TYPE_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/tariffs/quote:
    get:
      tags: [Tariffs]
      summary: Quote a price for a (kitType, dayType, durationMinutes)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: kitType
          required: true
          schema: { type: string }
        - in: query
          name: dayType
          required: true
          schema: { type: string, enum: [WEEKDAY, WEEKEND] }
        - in: query
          name: durationMinutes
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TariffQuoteResponse' }
        '404':
          description: TARIFF_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /v1/tariffs/{id}:
    patch:
      tags: [Tariffs]
      summary: Update price/currency (key immutable)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTariffRequest' }
      responses:
        '200':
          description: Updated tariff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TariffResponse' }
    delete:
      tags: [Tariffs]
      summary: Soft delete a tariff
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: No content
  /v1/webhooks/ha/door-events:
    post:
      tags: [Webhooks]
      summary: HA door-events ingress (shared-secret auth, not JWT)
      description: OPEN on AVAILABLE locker → UnauthorizedDoorOpenDetected; OPEN with rental → LockerOpened; CLOSED → LockerClosed.
      parameters:
        - in: header
          name: X-HA-Webhook-Secret
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoorEventRequest' }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acknowledged' }
        '401':
          description: WEBHOOK_SECRET_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Admin or renter JWT (RS256). Admin endpoints reject `type: renter` tokens and vice versa (FORBIDDEN).'
    BotSecret:
      type: http
      scheme: bearer
      description: 'Bot secret for the telegram exchange — `Authorization: Bot <secret>`.'
  schemas:
    ErrorResponse:
      type: object
      required: [correlationId, code, message, timestamp]
      properties:
        correlationId: { type: string, format: uuid }
        code: { type: string, description: 'Error code, e.g. INVALID_CREDENTIALS, CONSENT_REQUIRED' }
        message: { type: string, description: 'Localized message (ADR-006 chain: JWT locale → org defaultLocale → uk)' }
        timestamp: { type: string, format: date-time }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, description: 'Case-insensitive' }
        password: { type: string, format: password, description: 'Plaintext, never logged' }
    LoginResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, admin]
      properties:
        accessToken: { type: string, description: 'RS256 JWT, 15-min TTL' }
        refreshToken: { type: string, description: 'RS256 JWT, 7-day TTL, tokenType refresh' }
        expiresIn: { type: integer, description: 'Access TTL seconds (900)' }
        admin:
          type: object
          required: [id, orgId, role, email]
          properties:
            id: { type: string, format: uuid }
            orgId: { type: string, format: uuid, nullable: true, description: 'null for SUPER_ADMIN' }
            role: { type: string, enum: [SUPER_ADMIN, ORG_ADMIN, STATION_OPERATOR] }
            email: { type: string, format: email }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TelegramExchangeRequest:
      type: object
      required: [telegramId]
      properties:
        telegramId: { type: integer, format: int64, description: 'Telegram user id' }
    TelegramExchangeResponse:
      type: object
      required: [accessToken, expiresIn, renter]
      properties:
        accessToken: { type: string, description: 'Renter JWT (type: renter), 15-min TTL' }
        expiresIn: { type: integer }
        renter: { $ref: '#/components/schemas/RenterProfile' }
    RegisterRenterRequest:
      type: object
      required: [name, phone, consentGiven, consentVersion]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        phone: { type: string, pattern: '^\\+[0-9]{8,15}$', description: 'E.164' }
        consentGiven: { type: boolean, description: 'Must be true (BR-01.1)' }
        consentVersion: { type: string, description: 'Currently-published statement version, e.g. "v1"' }
        locale: { type: string, enum: [uk, en], default: uk }
        telegramId: { type: integer, format: int64, description: 'Bind to Telegram now (used at exchange)' }
    RegisterRenterResponse:
      type: object
      required: [renter, accessToken, expiresIn, alreadyRegistered]
      properties:
        renter: { $ref: '#/components/schemas/RenterProfile' }
        accessToken: { type: string }
        expiresIn: { type: integer }
        alreadyRegistered: { type: boolean, description: 'true when the phone was already bound to an ACTIVE renter (FR-028)' }
    RenterProfile:
      type: object
      required: [id, orgId, name, phone, consentGivenAt, consentVersion, locale, status]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string, pattern: '^\\+[0-9]{8,15}$' }
        consentGivenAt: { type: string, format: date-time }
        consentVersion: { type: string }
        locale: { type: string, enum: [uk, en] }
